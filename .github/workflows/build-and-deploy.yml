name: Build and Deploy Mimir

# Mirrors Huginn's release model:
#   gh release create vX.Y.Z
#     → test → build → deploy-idle (dynamically resolved) → staging smoke
#   Then: Promote to Production workflow (promote.yml) after reviewing idle staging
#     → promote-prod.sh: SHA guard, CNAME swap, prod smoke
#
# Runs on published releases or manual dispatch, not on every push.
# Manual dispatch can build images without deploying or running ambient migrations.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      deploy_to_idle:
        description: Deploy to idle after building, including configured database migrations
        type: boolean
        required: true
        default: true
      experts_staging_only:
        description: Run the isolated Cedar companion on existing idle; no normal EB deployment
        type: boolean
        required: true
        default: false
      experts_suite:
        description: Explicit core readiness or full eleven-case Cedar verification
        type: choice
        required: true
        default: core
        options: [core, full]
      experts_resource_profile:
        description: Default resources or explicit measured shared 1 GiB staging trial
        type: choice
        required: true
        default: default
        options: [default, aggregate1024]
      experts_candidate_run_id:
        description: Successful build-only Actions run with exact candidate image receipt
        type: string
        required: false
        default: ''
      experts_candidate_sha:
        description: Exact forty-character source SHA from that build-only run
        type: string
        required: false
        default: ''
      preflight_only:
        description: Inspect idle host identity and capacity without deployment or database access
        type: boolean
        required: true
        default: false
      wake_idle:
        description: Bring the existing idle environment online before preflight; no candidate deployment
        type: boolean
        required: true
        default: false

env:
  DOCKERHUB_IMAGE: featurefactory/mimir-mcp
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  # ── 1. Tests ──────────────────────────────────────────────────────────────
  test:
    name: Run Tests
    if: ${{ !inputs.preflight_only && !inputs.experts_staging_only }}
    runs-on: ubuntu-latest
    env:
      MIMIR_ENV: test
      DJANGO_SETTINGS_MODULE: mimir.settings
      DATABASE_URL: postgresql://huginn:huginn@localhost:5432/mimir_test
      EXPERTS_OWNED_PG_TESTS: '1'
      MIMIR_REQUIRE_FOB_COMPAT: '1'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mimir_test
          POSTGRES_USER: huginn
          POSTGRES_PASSWORD: huginn
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep graphviz
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-facade.txt
          pip install pytest-cov pytest-html

      - name: Run database migrations
        run: python manage.py migrate --noinput

      - name: Run tests with coverage
        run: |
          bash -n scripts/factory.sh scripts/preflight.sh scripts/claim.sh scripts/done.sh \
                   scripts/reject.sh scripts/status.sh scripts/bb-append.sh \
                   scripts/verify-result.sh scripts/integrate.sh scripts/release.sh \
                   scripts/archive.sh scripts/rescue-result.sh scripts/factory-git.sh \
                   scripts/lib/factory-common.sh scripts/lib/factory-git-inner.sh
          bash tests/unit/test_promote_revision_guard.sh
          pytest tests/ -v \
            --ignore=tests/e2e \
            --ignore=tests/integration/test_mcp_server_acceptance.py \
            --ignore=tests/integration/test_mcp_facade.py \
            --ignore=tests/integration/test_mcp_e2e_all_tools.py \
            --ignore=tests/unit/test_activity_graph_service.py \
            --cov=. \
            --cov-report=html \
            --cov-report=term \
            --cov-report=xml \
            --html=report.html \
            --self-contained-html

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: github.event_name != 'pull_request'
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-mimir

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            report.html
            htmlcov/


  # ── 2. Build and push Docker images ──────────────────────────────────────
  build-and-push:
    name: Build and Push Docker Images
    needs: test
    runs-on: ubuntu-latest
    if: always() && !inputs.preflight_only && !inputs.experts_staging_only && needs.test.result == 'success'

    outputs:
      image_suffix: ${{ steps.tag.outputs.suffix }}
      git_revision: ${{ steps.tag.outputs.revision }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configure AWS credentials
        if: vars.AWS_ACCOUNT_ID != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to AWS ECR
        if: vars.AWS_ACCOUNT_ID != ''
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image tag suffix
        id: tag
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BRANCH=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          SUFFIX="${BRANCH}-${SHORT_SHA}"
          echo "suffix=${SUFFIX}" >> $GITHUB_OUTPUT
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "revision=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          else
            echo "revision=${SUFFIX}" >> $GITHUB_OUTPUT
          fi
          if [[ "$GITHUB_REF" == "refs/heads/main" || "${{ github.event_name }}" == "release" ]]; then
            echo "latest=true" >> $GITHUB_OUTPUT
          else
            echo "latest=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and push web image → ECR
        if: vars.AWS_ACCOUNT_ID != ''
        id: web-image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/mimir:${{ steps.tag.outputs.suffix }}
            ${{ steps.tag.outputs.latest == 'true' && format('{0}/mimir:latest', steps.ecr-login.outputs.registry) || '' }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Build and push MCP facade image → Docker Hub
        id: facade-image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.mcp
          push: true
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:${{ steps.tag.outputs.suffix }}
            ${{ steps.tag.outputs.latest == 'true' && format('{0}:latest', env.DOCKERHUB_IMAGE) || '' }}
          cache-from: type=gha,scope=mcp-facade
          cache-to: type=gha,scope=mcp-facade,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Record exact candidate image identities
        env:
          SOURCE_REVISION: ${{ github.sha }}
          WEB_DIGEST: ${{ steps.web-image.outputs.digest }}
          FACADE_DIGEST: ${{ steps.facade-image.outputs.digest }}
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_SUFFIX: ${{ steps.tag.outputs.suffix }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          web = os.environ['WEB_DIGEST']
          facade = os.environ['FACADE_DIGEST']
          digest_pattern = r'sha256:[0-9a-f]{64}'
          assert re.fullmatch(digest_pattern, facade), 'Missing facade digest'
          if os.environ['ECR_REGISTRY']:
              assert re.fullmatch(digest_pattern, web), 'Missing web digest'
          receipt = {
              'source_revision': os.environ['SOURCE_REVISION'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'image_suffix': os.environ['IMAGE_SUFFIX'],
              'web_image': os.environ['ECR_REGISTRY'] + '/mimir',
              'web_digest': web,
              'facade_image': os.environ['DOCKERHUB_IMAGE'],
              'facade_digest': facade,
              'platforms': ['linux/amd64', 'linux/arm64'],
          }
          Path('candidate-image-identities.json').write_text(
              json.dumps(receipt, indent=2) + '\n'
          )
          PY

      - name: Retain exact candidate image identities
        uses: actions/upload-artifact@v4
        with:
          name: candidate-image-identities-${{ github.run_id }}
          path: candidate-image-identities.json

  # ── 3. Deploy to idle EB env + staging smoke ─────────────────────────────
  deploy-idle:
    name: Deploy to Idle EB env (staging smoke)
    # Deploys to whichever env is currently idle (dynamically resolved by CNAME).
    # Does NOT swap prod. Trigger promote.yml after reviewing idle staging smoke.
    needs: build-and-push
    runs-on: ubuntu-latest
    # Only on published release or manual dispatch — not on every push to main.
    if: >
      vars.AWS_ACCOUNT_ID != '' && !inputs.preflight_only && !inputs.experts_staging_only && (
        github.event_name == 'release' ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy_to_idle)
      )

    env:
      EB_APP: mimir
      EB_ENV_A: mimir-prod
      EB_ENV_B: mimir-idle
      EB_BUCKET: elasticbeanstalk-us-east-1-${{ vars.AWS_ACCOUNT_ID }}
      S3_BACKUP_BUCKET: ${{ vars.S3_BACKUP_BUCKET || 'mimir-db-backups-411113550285' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to AWS ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute version label
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BRANCH=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          SUFFIX="${BRANCH}-${SHORT_SHA}"
          echo "suffix=${SUFFIX}" >> $GITHUB_OUTPUT
          echo "label=v-${SUFFIX}-r${{ github.run_number }}" >> $GITHUB_OUTPUT
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "revision=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          else
            echo "revision=${SUFFIX}" >> $GITHUB_OUTPUT
          fi

      - name: Generate docker-compose.yml from template
        env:
          IMAGE_WEB: ${{ steps.ecr-login.outputs.registry }}/mimir:${{ steps.version.outputs.suffix }}
        run: |
          envsubst '$IMAGE_WEB' < deploy/docker-compose.tmpl.yml > docker-compose.yml
          echo "=== Deployment manifest ===" && cat docker-compose.yml

      - name: Package deployment bundle
        run: |
          zip deploy-bundle.zip docker-compose.yml
          if [ -d .ebextensions ]; then
            zip -qr deploy-bundle.zip .ebextensions/
          fi
          if [ -d .platform/hooks/postdeploy ]; then
            chmod +x .platform/hooks/postdeploy/*.sh
            zip -qr deploy-bundle.zip .platform/
          fi

      - name: Deploy to idle env + staging smoke
        id: deploy
        env:
          EB_APP: ${{ env.EB_APP }}
          EB_ENV_A: ${{ env.EB_ENV_A }}
          EB_ENV_B: ${{ env.EB_ENV_B }}
          EB_BUCKET: ${{ env.EB_BUCKET }}
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_SUFFIX: ${{ steps.version.outputs.suffix }}
          VERSION_LABEL: ${{ steps.version.outputs.label }}
          GIT_REVISION: ${{ steps.version.outputs.revision }}
          DEPLOY_BUNDLE_PATH: deploy-bundle.zip
          # GitHub PAT for the in-app Feedback widget (Issues: write on FeatureFactory-io/mimir).
          # Store as repo secret GH_BUG_REPORT_TOKEN. If absent, the existing EB value is kept.
          GH_BUG_REPORT_TOKEN: ${{ secrets.GH_BUG_REPORT_TOKEN }}
          S3_BACKUP_BUCKET: ${{ env.S3_BACKUP_BUCKET }}
        run: bash scripts/deploy-idle.sh

      - name: Deployment summary
        if: always()
        run: |
          echo "## 🛸 Idle EB Deployment — ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Version label** | \`${{ steps.version.outputs.label }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Revision** | \`${{ steps.version.outputs.revision }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Web image** | \`${{ steps.ecr-login.outputs.registry }}/mimir:${{ steps.version.outputs.suffix }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **MCP image** | \`${{ env.DOCKERHUB_IMAGE }}:${{ steps.version.outputs.suffix }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next step:** trigger the **Promote to Production** workflow (\`promote.yml\`) after reviewing the idle URL." >> $GITHUB_STEP_SUMMARY

  wake_idle:
    name: Bring existing idle environment online
    if: github.event_name == 'workflow_dispatch' && inputs.wake_idle && !inputs.experts_staging_only
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: mimir-idle-power
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Require preflight mode and no candidate deployment
        env:
          PREFLIGHT_ONLY: ${{ inputs.preflight_only }}
          DEPLOY_TO_IDLE: ${{ inputs.deploy_to_idle }}
        run: |
          test "$PREFLIGHT_ONLY" = true
          test "$DEPLOY_TO_IDLE" = false
      - name: Checkout existing power workflow
        uses: actions/checkout@v4
      - name: Configure existing deployment connection
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Start only the environment without the production CNAME
        env:
          EB_APP: mimir
          EB_ENV_A: mimir-prod
          EB_ENV_B: mimir-idle
          PROD_CNAME_SUBSTRING: mimir-prod.eba-
          EB_IDLE_WAIT_SSM: '1'
        run: bash scripts/eb_idle_power.sh start

  staging-preflight:
    name: Read-only staging identity and capacity
    needs: wake_idle
    if: >-
      always() && github.event_name == 'workflow_dispatch' && inputs.preflight_only && !inputs.experts_staging_only &&
      (needs.wake_idle.result == 'success' || needs.wake_idle.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Require deployment disabled
        env:
          DEPLOY_TO_IDLE: ${{ inputs.deploy_to_idle }}
        run: |
          test "$DEPLOY_TO_IDLE" = false
          mkdir -p preflight-receipts
      - name: Configure existing deployment connection
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Resolve live and idle from actual environment identities
        id: identity
        run: |
          aws sts get-caller-identity --query '{Account:Account,Arn:Arn}' --output json > preflight-receipts/caller.json
          aws elasticbeanstalk describe-environments --application-name mimir --environment-names mimir-prod mimir-idle --output json > preflight-receipts/environments.json
          python3 - <<'PY_IDENTITY'
          import json
          import os
          from pathlib import Path
          data = json.loads(Path('preflight-receipts/environments.json').read_text())
          environments = data['Environments']
          assert len(environments) == 2, 'Require exactly the two declared environments.'
          assert {item['EnvironmentName'] for item in environments} == {'mimir-prod', 'mimir-idle'}
          assert all(item['Status'] == 'Ready' for item in environments), 'Environment must be stable.'
          live = [item for item in environments if 'mimir-prod.eba-' in item.get('CNAME', '')]
          assert len(live) == 1, 'Production CNAME identity must be unambiguous.'
          idle = next(item for item in environments if item['EnvironmentId'] != live[0]['EnvironmentId'])
          assert idle.get('CNAME') and idle['CNAME'] != live[0]['CNAME']
          receipt = {'live': live[0], 'idle': idle, 'operation': 'read-only; no deployment or database access'}
          Path('preflight-receipts/identity.json').write_text(json.dumps(receipt, indent=2))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('idle_env=' + idle['EnvironmentName'] + '\n')
          print('Resolved distinct live and idle environments from their current CNAMEs.')
          PY_IDENTITY
      - name: Read idle launch and network metadata without starting a host
        env:
          IDLE_ENV: ${{ steps.identity.outputs.idle_env }}
        run: |
          aws elasticbeanstalk describe-environment-resources --environment-name "$IDLE_ENV" --output json > preflight-receipts/resources.json
          python3 - <<'PY_LAYOUT'
          import json
          from pathlib import Path
          resources = json.loads(Path('preflight-receipts/resources.json').read_text())['EnvironmentResources']
          groups = resources['AutoScalingGroups']
          templates = resources['LaunchTemplates']
          assert len(groups) == 1 and len(templates) == 1
          Path('preflight-receipts/asg-name.txt').write_text(groups[0]['Name'])
          Path('preflight-receipts/launch-template-id.txt').write_text(templates[0]['Id'])
          PY_LAYOUT
          ASG_NAME=$(cat preflight-receipts/asg-name.txt)
          LAUNCH_TEMPLATE_ID=$(cat preflight-receipts/launch-template-id.txt)
          aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names "$ASG_NAME" --query 'AutoScalingGroups[].{AutoScalingGroupName:AutoScalingGroupName,MinSize:MinSize,MaxSize:MaxSize,DesiredCapacity:DesiredCapacity,VPCZoneIdentifier:VPCZoneIdentifier,LaunchTemplate:LaunchTemplate,MixedInstancesPolicy:MixedInstancesPolicy}' --output json > preflight-receipts/autoscaling.json
          aws ec2 describe-launch-template-versions --launch-template-id "$LAUNCH_TEMPLATE_ID" --versions '$Latest' --query 'LaunchTemplateVersions[].{VersionNumber:VersionNumber,ImageId:LaunchTemplateData.ImageId,InstanceType:LaunchTemplateData.InstanceType,IamInstanceProfile:LaunchTemplateData.IamInstanceProfile,SecurityGroupIds:LaunchTemplateData.SecurityGroupIds,NetworkInterfaces:LaunchTemplateData.NetworkInterfaces,BlockDeviceMappings:LaunchTemplateData.BlockDeviceMappings,MetadataOptions:LaunchTemplateData.MetadataOptions}' --output json > preflight-receipts/launch-metadata.json
          python3 - <<'PY_SUBNET_IDS'
          import json
          from pathlib import Path
          groups = json.loads(Path('preflight-receipts/autoscaling.json').read_text())
          assert len(groups) == 1
          subnets = groups[0]['VPCZoneIdentifier'].split(',')
          assert subnets and all(item.startswith('subnet-') and item[7:].isalnum() for item in subnets)
          Path('preflight-receipts/subnet-ids.txt').write_text('\n'.join(subnets))
          PY_SUBNET_IDS
          mapfile -t SUBNET_IDS < preflight-receipts/subnet-ids.txt
          aws ec2 describe-subnets --subnet-ids "${SUBNET_IDS[@]}" --query 'Subnets[].{SubnetId:SubnetId,VpcId:VpcId,AvailabilityZone:AvailabilityZone,MapPublicIpOnLaunch:MapPublicIpOnLaunch,AvailableIpAddressCount:AvailableIpAddressCount}' --output json > preflight-receipts/subnets.json
      - name: Verify idle instance ownership and SSM availability
        id: host
        env:
          IDLE_ENV: ${{ steps.identity.outputs.idle_env }}
        run: |
          aws elasticbeanstalk describe-environment-resources --environment-name "$IDLE_ENV" --output json > preflight-receipts/resources.json
          python3 - <<'PY_IDS'
          import json
          from pathlib import Path
          data = json.loads(Path('preflight-receipts/resources.json').read_text())
          ids = [item['Id'] for item in data['EnvironmentResources']['Instances']]
          assert ids and all(item.startswith('i-') and item[2:].isalnum() for item in ids), 'No existing idle host; capacity remains unverified.'
          Path('preflight-receipts/instance-ids.txt').write_text('\n'.join(sorted(ids)))
          PY_IDS
          mapfile -t INSTANCE_IDS < preflight-receipts/instance-ids.txt
          aws ec2 describe-instances --instance-ids "${INSTANCE_IDS[@]}" --query 'Reservations[].Instances[].{InstanceId:InstanceId,State:State.Name,Type:InstanceType,Architecture:Architecture,Tags:Tags}' --output json > preflight-receipts/instances.json
          python3 - <<'PY_HOST'
          import json
          import os
          from pathlib import Path
          hosts = json.loads(Path('preflight-receipts/instances.json').read_text())
          assert hosts and all(item['State'] == 'running' for item in hosts)
          for item in hosts:
              tags = {tag['Key']: tag['Value'] for tag in item['Tags']}
              assert tags.get('elasticbeanstalk:environment-name') == os.environ['IDLE_ENV'], 'Host ownership mismatch.'
          instance_id = sorted(item['InstanceId'] for item in hosts)[0]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('instance_id=' + instance_id + '\n')
          Path('preflight-receipts/selected-instance.txt').write_text(instance_id)
          PY_HOST
          INSTANCE_ID=$(cat preflight-receipts/selected-instance.txt)
          aws ssm describe-instance-information --filters "Key=InstanceIds,Values=$INSTANCE_ID" --output json > preflight-receipts/ssm.json
          python3 - <<'PY_SSM'
          import json
          from pathlib import Path
          hosts = json.loads(Path('preflight-receipts/ssm.json').read_text())['InstanceInformationList']
          assert len(hosts) == 1 and hosts[0]['PingStatus'] == 'Online', 'Idle SSM host unavailable; no remote operation performed.'
          PY_SSM
      - name: Read bounded host capacity without application configuration
        env:
          INSTANCE_ID: ${{ steps.host.outputs.instance_id }}
        run: |
          python3 - <<'PY_CAPACITY'
          import json
          from pathlib import Path
          commands = ['set -eu', 'uname -m', 'getconf _NPROCESSORS_ONLN', 'free -b', 'df -Pk /', 'docker info --format "{{.ServerVersion}} {{.Architecture}} {{.MemTotal}} {{.NCPU}}"', 'docker ps --format "{{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"']
          Path('preflight-receipts/capacity-parameters.json').write_text(json.dumps({'commands': commands, 'executionTimeout': ['60']}))
          PY_CAPACITY
          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --comment 'Mimir Experts read-only isolated-staging capacity' --parameters file://preflight-receipts/capacity-parameters.json --query Command.CommandId --output text)
          printf '%s\n' "$COMMAND_ID" > preflight-receipts/command-id.txt
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --output json > preflight-receipts/capacity.json
          python3 - <<'PY_RESULT'
          import json
          from pathlib import Path
          result = json.loads(Path('preflight-receipts/capacity.json').read_text())
          assert result['Status'] == 'Success' and result['ResponseCode'] == 0
          print(result['StandardOutputContent'])
          PY_RESULT
      - name: Preserve read-only preflight receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experts-staging-preflight-${{ github.run_id }}
          path: preflight-receipts/
          if-no-files-found: warn
          retention-days: 7

  experts-staging:
    name: Owned Cedar companion readiness on existing idle
    if: github.event_name == 'workflow_dispatch' && inputs.experts_staging_only
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.experts_suite == 'full' && 180 || 45 }}
    concurrency:
      group: mimir-idle-power
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    env:
      CANDIDATE_RUN_ID: ${{ inputs.experts_candidate_run_id }}
      CANDIDATE_SHA: ${{ inputs.experts_candidate_sha }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      EXPERTS_SUITE: ${{ inputs.experts_suite }}
      RESOURCE_PROFILE: ${{ inputs.experts_resource_profile }}
      BROWSER_IMAGE: 411113550285.dkr.ecr.us-east-1.amazonaws.com/mimir@sha256:a74104c8fb4ff8a02dd053ee2584868d91dd4273f058b690faf0875684c5e368
      POSTGRES_IMAGE: postgres@sha256:07abc3f43c9395b0bdbbab36bc25ddb0e8d83cd4fcafb5fb7d6abe14ff156dd8
    steps:
      - name: Require isolated-only mode and validated candidate selectors
        env:
          NORMAL_DEPLOY: ${{ inputs.deploy_to_idle }}
          PREFLIGHT_ONLY: ${{ inputs.preflight_only }}
          WAKE_IDLE: ${{ inputs.wake_idle }}
        run: |
          set -euo pipefail
          test "$NORMAL_DEPLOY" = false
          test "$PREFLIGHT_ONLY" = false
          test "$WAKE_IDLE" = false
          case "$EXPERTS_SUITE" in core|full) ;; *) exit 2 ;; esac
          case "$RESOURCE_PROFILE" in default|aggregate1024) ;; *) exit 2 ;; esac
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
      - name: Checkout reviewed runner and candidate Git objects
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up runner Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install only control-plane validation dependencies
        run: python -m pip install boto3 pytest pyyaml 'playwright>=1.40.0'
      - name: Verify fail-closed runner contracts
        run: python -m pytest -p no:cacheprovider -c /dev/null --confcutdir=tests/unit tests/unit/test_experts_staging_runner_contract.py tests/unit/test_experts_staging_runner_config.py tests/unit/test_experts_staging_suite.py tests/unit/test_experts_staging_suite_workflow.py tests/unit/test_experts_staging_resource_workflow.py tests/unit/test_experts_staging_resource_profile.py tests/unit/test_experts_staging_aggregate.py tests/unit/test_experts_staging_capture_contract.py tests/unit/test_experts_staging_saga_contract.py tests/unit/test_experts_staging_saga_trace.py tests/unit/test_experts_staging_saga_guest.py tests/unit/test_experts_staging_saga_visual.py tests/unit/test_experts_staging_saga_summary_contract.py -q
      - name: Download exact candidate build receipt
        uses: actions/download-artifact@v4
        with:
          name: candidate-image-identities-${{ inputs.experts_candidate_run_id }}
          run-id: ${{ inputs.experts_candidate_run_id }}
          github-token: ${{ github.token }}
          path: candidate-receipt
      - name: Verify immutable measured resource proof
        if: inputs.experts_resource_profile == 'aggregate1024'
        run: |
          set -euo pipefail
          gh api --method GET repos/FeatureFactory-io/mimir/actions/artifacts/14991594192/zip > measured-resource-proof.zip
          python scripts/experts-staging/download_resource_proof.py \
            --archive measured-resource-proof.zip --output measured-resource-proof
      - name: Verify actual successful build-only run and prepare source proof
        id: experts-source
        run: |
          set -euo pipefail
          RESOURCE_PROOF_ARGS=()
          if [[ "$RESOURCE_PROFILE" = aggregate1024 ]]; then
            RESOURCE_PROOF_ARGS=(
              --resource-proof-result measured-resource-proof/benchmark-result.json
              --resource-proof-source measured-resource-proof/benchmark-source.json
            )
          fi
          python scripts/experts-staging/controller.py prepare \
            --receipt candidate-receipt/candidate-image-identities.json \
            --revision "$CANDIDATE_SHA" --run-id "$CANDIDATE_RUN_ID" \
            --account "$AWS_ACCOUNT_ID" --output experts-readiness \
            --resource-profile "$RESOURCE_PROFILE" "${RESOURCE_PROOF_ARGS[@]}"
      - name: Configure existing deployment connection
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Log in to existing ECR repository
        id: experts-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Record actual immutable image sizes before any host pull
        env:
          WEB_IMAGE: ${{ steps.experts-source.outputs.web_image }}
        run: |
          set -euo pipefail
          docker pull "$WEB_IMAGE" >/dev/null
          docker pull "$BROWSER_IMAGE" >/dev/null
          docker pull "$POSTGRES_IMAGE" >/dev/null
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          images = {name: json.loads(subprocess.check_output(['docker', 'image', 'inspect', image]))[0]
                    for name, image in {'web': os.environ['WEB_IMAGE'], 'browser': os.environ['BROWSER_IMAGE'], 'postgres': os.environ['POSTGRES_IMAGE']}.items()}
          postgres = next(value for value in images['postgres']['RepoDigests'] if value.startswith('postgres@sha256:'))
          receipt = {'browser_image': os.environ['BROWSER_IMAGE'], 'postgres_image': postgres,
                     'image_sizes': {name: value['Size'] for name, value in images.items()}}
          Path('experts-readiness/image-runtime-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
      - name: Execute only owned companion and export actual browser artifacts
        run: |
          set -euo pipefail
          python scripts/experts-staging/controller.py execute \
            --output experts-readiness --images experts-readiness/image-runtime-receipt.json \
            --suite "$EXPERTS_SUITE"
      - name: Retain owned readiness evidence and actual open conditions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experts-idle-readiness-${{ github.run_id }}
          path: experts-readiness/
          if-no-files-found: warn
