name: Experts isolated Linux memory benchmark

on:
  workflow_dispatch:
    inputs:
      web_memory_mib:
        description: Explicit experiment, not an idle runtime configuration change
        type: choice
        required: true
        default: '384'
        options: ['384', '256']
      browser_memory_mib:
        description: CI-only browser finalization diagnostic; idle defaults stay unchanged
        type: choice
        required: true
        default: '512'
        options: ['512', '768']

permissions:
  contents: read
  actions: read

jobs:
  benchmark:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/diagnostics/experts-linux-memory-benchmark-20261125'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: experts-disposable-linux-memory-benchmark
      cancel-in-progress: false
    env:
      CANDIDATE_SHA: 04c9432bce7eac5ec34a090bc5e8ec4fa06f409d
      CANDIDATE_RUN_ID: '45516980492'
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install control-plane proof dependencies
        run: python -m pip install boto3 pytest pyyaml
      - name: Validate runtime guards and benchmark-only workflow
        run: |
          python -m pytest -p no:cacheprovider -c /dev/null --confcutdir=tests/unit tests/unit/test_experts_staging_runner_contract.py tests/unit/test_experts_staging_runner_config.py tests/unit/test_experts_staging_benchmark.py tests/unit/test_experts_staging_benchmark_workflow.py tests/unit/test_experts_staging_capture_contract.py -k 'not test_workflow_with_normal_defaults_has_no_implicit_companion_dispatch and not test_workflow_with_untrusted_selectors_uses_environment_and_guards_before_aws' -q
      - name: Download successful immutable candidate build receipt
        uses: actions/download-artifact@v4
        with:
          name: candidate-image-identities-45516980492
          run-id: 45516980492
          github-token: ${{ github.token }}
          path: candidate-receipt
      - name: Verify build identity and exact candidate source
        run: |
          python scripts/experts-staging/controller.py prepare --receipt candidate-receipt/candidate-image-identities.json --revision "$CANDIDATE_SHA" --run-id "$CANDIDATE_RUN_ID" --account "$AWS_ACCOUNT_ID" --output experts-readiness
      - name: Connect existing registry credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Pull only three fixed immutable images on this disposable CI runner
        run: |
          set -euo pipefail
          docker pull 411113550285.dkr.ecr.us-east-1.amazonaws.com/mimir@sha256:e7f6e2170fd6250a9b6c3f635ceb2b90d0dfbe81ed337c10180c0a903ca5e1ba >/dev/null
          docker pull 411113550285.dkr.ecr.us-east-1.amazonaws.com/mimir@sha256:a74104c8fb4ff8a02dd053ee2584868d91dd4273f058b690faf0875684c5e368 >/dev/null
          docker pull postgres@sha256:07abc3f43c9395b0bdbbab36bc25ddb0e8d83cd4fcafb5fb7d6abe14ff156dd8 >/dev/null
      - name: Run the genuine owned workload without the job credential environment
        env:
          EXPERIMENT_WEB_MEMORY_MIB: ${{ inputs.web_memory_mib }}
          EXPERIMENT_BROWSER_MEMORY_MIB: ${{ inputs.browser_memory_mib }}
        run: |
          set -euo pipefail
          case "$EXPERIMENT_WEB_MEMORY_MIB" in 384|256) ;; *) exit 2 ;; esac
          case "$EXPERIMENT_BROWSER_MEMORY_MIB" in 512|768) ;; *) exit 2 ;; esac
          sudo /usr/bin/env -i /usr/bin/python3 "$GITHUB_WORKSPACE/scripts/experts-staging/benchmark.py" --prepared-output "$GITHUB_WORKSPACE/experts-readiness" --web-memory-mib "$EXPERIMENT_WEB_MEMORY_MIB" --browser-memory-mib "$EXPERIMENT_BROWSER_MEMORY_MIB" --output "$GITHUB_WORKSPACE/benchmark-public"
      - name: Retain vetted numeric and actual browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experts-linux-memory-benchmark-${{ github.run_id }}
          path: benchmark-public/
          if-no-files-found: warn
