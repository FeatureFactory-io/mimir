name: Original full-stage SSM read-only diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-original-invocations:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/diagnostics/experts-full-stage-45572474749'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install read-only SDK and focused test dependencies
        run: python -m pip install boto3 pytest pyyaml
      - name: Check only the diagnostic protocol
        run: python -m pytest -p no:cacheprovider -c /dev/null --confcutdir=tests/unit tests/unit/test_experts_original_invocations_diagnostic.py -q
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Read two exact original SSM invocations
        id: read
        run: python scripts/experts-staging/diagnose_original_invocations.py
      - name: Retain only positively published typed diagnostic facts
        if: always() && steps.read.outputs.safe_json == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-45572474749
          path: diagnostic-45572474749.json
          if-no-files-found: error
