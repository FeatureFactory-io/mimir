{# Success + error toasts for Copy Prompt mockups (IA §6.2) #}
<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 1080" aria-live="polite">
    <div id="copy-prompt-toast"
         class="toast align-items-center text-bg-success border-0"
         role="alert"
         aria-live="assertive"
         aria-atomic="true"
         data-bs-autohide="true"
         data-bs-delay="2000"
         data-testid="copy-prompt-toast">
        <div class="d-flex">
            <div class="toast-body">
                <i class="fa-solid fa-check me-1" aria-hidden="true"></i> Prompt copied to clipboard
            </div>
            <button type="button"
                    class="btn-close btn-close-white me-2 m-auto"
                    data-bs-dismiss="toast"
                    aria-label="Close"></button>
        </div>
    </div>
    <div id="copy-prompt-error-toast"
         class="toast align-items-center text-bg-danger border-0"
         role="alert"
         aria-live="assertive"
         aria-atomic="true"
         data-bs-autohide="true"
         data-bs-delay="4000"
         data-testid="copy-prompt-error-toast">
        <div class="d-flex">
            <div class="toast-body">
                <i class="fa-solid fa-circle-exclamation me-1" aria-hidden="true"></i>
                Could not copy to clipboard. Check browser permissions.
            </div>
            <button type="button"
                    class="btn-close btn-close-white me-2 m-auto"
                    data-bs-dismiss="toast"
                    aria-label="Close"></button>
        </div>
    </div>
</div>
